name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Node formats numbers and dates for the locale it starts in. Output that must not
      # change with the reader's locale is tested in one that writes 1.234,5.
      - name: Test again in a comma-decimal locale
        run: npm test
        env:
          LC_ALL: de_DE.UTF-8
          LANG: de_DE.UTF-8
      - run: npm run build
